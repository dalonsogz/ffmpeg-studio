name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Caché de FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: tools\ffmpeg
          # Sube la versión del sufijo (v1 → v2) para forzar una descarga nueva.
          key: ffmpeg-${{ runner.os }}-n9.0-gpl-v1

      - name: Descargar FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Espejo de GitHub: gyan.dev limita las descargas y devuelve 503/504.
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip'
          curl.exe -L --fail --retry 5 --retry-delay 10 --retry-all-errors -o ffmpeg.zip $url
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo descargar FFmpeg (curl salió con $LASTEXITCODE)."
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download -Force
          $bin = Get-ChildItem ffmpeg-download -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path tools\ffmpeg\bin | Out-Null
          Copy-Item $bin.FullName tools\ffmpeg\bin\ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") tools\ffmpeg\bin\ffprobe.exe
          Get-ChildItem ffmpeg-download -Recurse -Filter LICENSE.txt | Select-Object -First 1 |
            Copy-Item -Destination tools\ffmpeg\LICENSE.txt -Force
          Remove-Item ffmpeg.zip -Force
          Remove-Item ffmpeg-download -Recurse -Force

      - name: Configurar FFmpeg
        shell: pwsh
        run: |
          "FFMPEG_DIR=$PWD\tools\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & tools\ffmpeg\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Crear vídeo de muestra
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\.probe\media | Out-Null
          & tools\ffmpeg\bin\ffmpeg.exe -y -f lavfi -i testsrc2=size=1280x720:rate=30 `
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 `
            -c:v libx264 -pix_fmt yuv420p -c:a aac ..\.probe\media\base.mp4
          $subs = @"
          1
          00:00:00,200 --> 00:00:01,500
          Subtitulo de prueba FFmpeg
          "@
          Set-Content -Path ..\.probe\media\subs.srt -Value $subs -Encoding utf8

      - name: Comprobar el JavaScript
        run: node --check web/app.js

      - name: Ejecutar las pruebas
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Compilar el ejecutable
        shell: pwsh
        run: .\build.bat

      - name: Guardar el portable
        uses: actions/upload-artifact@v7
        with:
          name: FFmpegStudio-portable
          path: dist/FFmpegStudio
          compression-level: 0

      - name: Instalar NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Compilar el instalador
        shell: pwsh
        run: .\installer\build-installer.ps1 -Version 1.0.1

      - name: Guardar el instalador
        uses: actions/upload-artifact@v7
        with:
          name: FFmpegStudio-instalador
          path: installer/Output/*.exe
          compression-level: 0
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: write-all
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FFmpegStudio-instalador
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

